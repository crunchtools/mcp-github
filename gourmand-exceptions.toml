
# Lint suppression — test intentionally passes invalid args to verify rejection
[[exceptions]]
check = "EV001-lint_suppression"
path = "tests/test_validation.py"
justification = "type: ignore[call-arg] is required to test that Pydantic rejects extra fields"
classification = "by_design"

[[exceptions]]
check = "CH006-primitive_obsession"
path = "src/mcp_github_crunchtools/__init__.py"
justification = "Standard default HTTP port"
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "src/mcp_github_crunchtools/models.py"
justification = "validate_name, validate_ref and validate_workflow_inputs apply different patterns and limits to different inputs. They share the pattern-match-then-raise shape, which is three statements."
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "src/mcp_github_crunchtools/client.py"
justification = "get_client and get_config are both the four-line lazy-singleton accessor: check the module global, construct if None, return. The duplication is the idiom; hiding it behind a generic obscures which global is being initialised."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "src/mcp_github_crunchtools/config.py"
justification = "SSL_CERT_FILE and GITHUB_SSL_VERIFY are real, intentional settings for self-hosted GHES with an internal CA -- confirmed against config.py's Config.__init__ (os.environ.get(\"SSL_CERT_FILE\") with no fallback -> default None/not-set; os.environ.get(\"GITHUB_SSL_VERIFY\", \"true\") -> default \"true\"; both defaults verified against this source, not a docstring). Documented by name, required/optional status, and default in README.md's Environment Variables table and CLAUDE.md. EV013 has no documentation detection of its own -- it only compares the var name against a fixed allowlist -- so this exception is the record that a human confirmed it is real and written down, defaults matching the actual code."
classification = "by_design"

[[exceptions]]
check = "EV002-manifest_lint_suppression"
path = "pyproject.toml"
justification = "Each remaining global ruff ignore was verified against this codebase with the project's own pinned toolchain (`uv run ruff check --select <RULE>`, ignore list temporarily cleared for an unmasked read) before being kept: TRY003 (7 src/ files, GitHub API error messages), PLR0913/PLR0917 (4 src/ files -- server.py, tools/actions.py, tools/issues.py, tools/pull_requests.py -- MCP tool signatures mirror the wire API and genuinely take many named/positional parameters), PLR2004 (client.py plus tests, HTTP status/size comparisons), PLW0603 (client.py + config.py, module-level lazy singletons), TID252 (5 src/ files, this package's own internal relative imports). Two previously-global entries with zero hits anywhere (S106) or fixable outright (PIE790: one redundant `pass` removed from errors.py; RUF022: one unsorted `__all__` in tools/__init__.py) were resolved with `ruff check --fix` instead of kept ignored. S101 (assert), S105 (a literal secret value in test fixtures), and PLC0415 (importing the module/fixture under test inside the test body) were moved from the global ignore into `[tool.ruff.lint.per-file-ignores]` for tests/* -- all three fire only in tests/, never in src/."
classification = "by_design"
